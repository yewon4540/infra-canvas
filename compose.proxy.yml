services:
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${EOLGAE_BIND_ADDRESS:-127.0.0.1}:${EOLGAE_HTTP_PORT:-8080}:80'
    depends_on:
      - api
      - web
volumes:
  caddy_data:
  caddy_config:

# 기본은 Caddy. Nginx 대체 구성은 아래 주석 블록을 참고한다.
# 공통 서비스 변경 시 docker-compose-without_nginx.yml에도 동일하게 반영한다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eolgae-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eolgae}
      POSTGRES_USER: ${POSTGRES_USER:-eolgae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-eolgae}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: eolgae-valkey
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eolgae-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eolgae}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-eolgae}
      VALKEY_URL: redis://valkey:6379/0
      JWT_SECRET: ${JWT_SECRET:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EOLGAE_AWS_ACCOUNT_ID: ${EOLGAE_AWS_ACCOUNT_ID:-}
      CFN_TEMPLATE_URL: ${CFN_TEMPLATE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      ARTIFACT_STORE_BACKEND: ${ARTIFACT_STORE_BACKEND:-local}
      ARTIFACT_LOCAL_ROOT: ${ARTIFACT_LOCAL_ROOT:-/var/lib/eolgae/artifacts}
      ARTIFACT_RETENTION_POLICY: ${ARTIFACT_RETENTION_POLICY:-keep}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-artifacts}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-ap-northeast-2}
      ARTIFACT_S3_ENDPOINT_URL: ${ARTIFACT_S3_ENDPOINT_URL:-}
      ARTIFACT_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-}
      ARTIFACT_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-}
      ARTIFACT_S3_SESSION_TOKEN: ${ARTIFACT_S3_SESSION_TOKEN:-}
      ARTIFACT_S3_FORCE_PATH_STYLE: ${ARTIFACT_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - artifact_data:/var/lib/eolgae/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eolgae-worker
    command: dramatiq eolgae.workers
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eolgae}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-eolgae}
      VALKEY_URL: redis://valkey:6379/0
      JWT_SECRET: ${JWT_SECRET:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EOLGAE_AWS_ACCOUNT_ID: ${EOLGAE_AWS_ACCOUNT_ID:-}
      CFN_TEMPLATE_URL: ${CFN_TEMPLATE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      ARTIFACT_STORE_BACKEND: ${ARTIFACT_STORE_BACKEND:-local}
      ARTIFACT_LOCAL_ROOT: ${ARTIFACT_LOCAL_ROOT:-/var/lib/eolgae/artifacts}
      ARTIFACT_RETENTION_POLICY: ${ARTIFACT_RETENTION_POLICY:-keep}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-artifacts}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-ap-northeast-2}
      ARTIFACT_S3_ENDPOINT_URL: ${ARTIFACT_S3_ENDPOINT_URL:-}
      ARTIFACT_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-}
      ARTIFACT_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-}
      ARTIFACT_S3_SESSION_TOKEN: ${ARTIFACT_S3_SESSION_TOKEN:-}
      ARTIFACT_S3_FORCE_PATH_STYLE: ${ARTIFACT_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - artifact_data:/var/lib/eolgae/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: eolgae-web
    # 브라우저가 접속하는 프록시 주소. production에서는 build args에도 전달한다.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      - api
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: eolgae-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api

  # Nginx 선택 구성: 위 caddy 서비스 전체를 주석 처리한 뒤 아래 블록의 주석을 해제한다.
  # 두 프록시를 동시에 켜면 호스트 80 포트가 충돌한다. 전환 절차: docs/REVERSE-PROXY.md
  # nginx:
  #   image: nginx:stable-alpine
  #   container_name: eolgae-nginx
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - web
  #     - api

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: eolgae-seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    profiles:
      - artifact-s3
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-eolgae}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-eolgae_dev_secret}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-eolgae-artifacts}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "8333:8333"

volumes:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:
  artifact_data:
  seaweedfs_data:

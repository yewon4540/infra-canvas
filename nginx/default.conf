# Loaded only when the commented nginx service is enabled in docker-compose.yml.
# Local HTTP example; TLS setup is separate (docs/REVERSE-PROXY.md).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Canvas payloads can exceed Nginx's default 1 MB request limit.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location /api/ {
        # Trailing slash removes /api/: /api/auth/login -> /auth/login.
        proxy_pass http://api:8000/;
        proxy_cookie_path /auth/refresh /api/auth/refresh;
        # Forward AI feedback SSE chunks as they arrive.
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://web:3000;
        # Also supports Next.js development HMR and streamed responses.
        proxy_buffering off;
    }
}
